[project]
name = "rp-api"
version = "0.1.0"
description = "FastAPI canonical API: tenancy, state transitions, artifacts, approvals, ledger, cost controls"
requires-python = ">=3.13"
dependencies = [
    "rp-contracts",
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.5",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pgvector==0.5.1",
    "pyjwt[crypto]==2.15.1",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "cryptography==50.0.2",
    "boto3==1.43.114",
    "httpx==0.28.1",
    "temporalio==1.34.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "python-dateutil==2.9.0.post0",
]

[project.scripts]
rp-api = "rp_api.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp_api"]
