[project]
name = "rp-contracts"
version = "0.1.0"
description = "Versioned shared domain contracts (state machine, events, agent IO, method definitions)"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.14.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp_contracts"]
