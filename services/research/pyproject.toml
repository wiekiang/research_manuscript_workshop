[project]
name = "rp-research"
version = "0.1.0"
description = "Temporal workflows, research activities, scholarly adapters, controlled fetch, model gateway, LangGraph agents"
requires-python = ">=3.13"
dependencies = [
    "rp-contracts",
    "rp-latex",
    "rp-experiment",
    "temporalio==1.34.0",
    "langgraph==1.2.16",
    "httpx==0.28.1",
    "anthropic==1.15.0",
    "pydantic-settings==2.16.0",
    "pyjwt[crypto]==2.15.1",
    "selectolax==1.0.1",
    "pypdf==6.21.1",
    "python-dateutil==2.9.0.post0",
    "opentelemetry-api==1.45.1",
]

[project.scripts]
rp-worker = "rp_research.worker:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp_research"]
