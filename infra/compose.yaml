# Local development / CI infrastructure. Images are referenced by tag here for readability;
# infra/images.lock records the digests that were tested (see docs/DEPLOYMENT.md).
name: research-platform

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rp_owner
      POSTGRES_PASSWORD: rp_owner_dev
      POSTGRES_DB: research_platform
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rp_owner -d research_platform"]
      interval: 3s
      retries: 20

  objectstore:
    # S3-compatible object storage (SeaweedFS). Any S3 API works in production.
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256"
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db", "--namespace", "research-platform"]
    ports: ["7233:7233", "8233:8233"]
    volumes:
      - temporaldata:/data
    user: "0:0"

volumes:
  pgdata: {}
  s3data: {}
  temporaldata: {}
