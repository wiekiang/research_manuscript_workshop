[project]
name = "rp-experiment"
version = "0.1.0"
description = "Sandboxed computational experiment execution, metric recomputation and reproducibility"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "rp-contracts",
    "rp-latex",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp_experiment"]
